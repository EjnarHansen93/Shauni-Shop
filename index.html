<title>Shauni's shop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap');
  :root{
    --serif:'Cormorant Garamond', Georgia, serif;
    --sans:'Inter', system-ui, -apple-system, sans-serif;
    --bg:#FAEDF1; --bgDeep:#F3DCE4; --surface:#FFFFFF;
    --plum:#5E1B34; --rose:#C24C74; --roseSoft:#F7DEE7;
    --gold:#B68A3C; --goldSoft:#E7CE96; --ink:#3A2A31; --grey:#A38F97;
    --line:#EBD6DE; --win:#3E7D54;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans); color:var(--ink);
    background:radial-gradient(1200px 400px at 50% -120px, var(--bgDeep), var(--bg));
    min-height:100vh; padding-bottom:40px;
    -webkit-text-size-adjust:100%;
  }
  input,select,button{font-family:var(--sans);}
  input:focus,select:focus{outline:2px solid var(--rose); outline-offset:1px;}
  select{
    appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23C24C74'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; padding-right:28px;
  }

  /* ---- lock screen ---- */
  #lock{min-height:100vh; display:grid; place-items:center; padding:24px;}
  .lockCard{background:var(--surface); border:1px solid var(--line); border-radius:22px;
    box-shadow:0 14px 40px rgba(94,27,52,.12); padding:30px 26px; max-width:340px; width:100%; text-align:center;}
  .lockBrand{font-family:var(--serif); font-size:30px; font-weight:600; color:var(--plum);}
  .lockSub{color:var(--grey); font-size:13px; margin:4px 0 20px;}
  .lockInput{width:100%; border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    font-size:16px; text-align:center; letter-spacing:1px; margin-bottom:12px;}
  .lockErr{color:var(--rose); font-size:13px; min-height:18px; margin-bottom:6px;}

  /* ---- header ---- */
  .hdr{background:linear-gradient(135deg, var(--plum), var(--rose)); color:#fff;
    padding-top:env(safe-area-inset-top);}
  .hdrIn{max-width:900px; margin:0 auto; padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brandWrap{display:flex; align-items:center; gap:12px; min-width:0;}
  .brand{font-family:var(--serif); font-size:26px; font-weight:600; line-height:1; letter-spacing:.3px;}
  .brandSub{font-size:11px; color:var(--goldSoft); margin-top:3px;}
  .hdrRight{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .status{font-size:11px; color:var(--goldSoft); white-space:nowrap;}
  .refreshBtn{background:rgba(255,255,255,.15); border:1px solid var(--goldSoft); color:#fff;
    width:36px; height:36px; border-radius:10px; font-size:16px; cursor:pointer;}
  .goldRule{height:3px; background:linear-gradient(90deg, transparent, var(--goldSoft), transparent);}

  /* ---- tabs ---- */
  .tabsWrap{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line);}
  .tabs{max-width:900px; margin:0 auto; padding:10px 16px; display:flex; gap:8px;}
  .tab{border:none; cursor:pointer; background:transparent; color:var(--plum);
    padding:8px 16px; border-radius:999px; font-size:15px; font-weight:500;}
  .tab.on{background:var(--plum); color:#fff;}

  main{max-width:900px; margin:0 auto; padding:16px;}

  .hero{background:var(--surface); border-radius:22px; padding:24px 22px 18px;
    box-shadow:0 10px 30px rgba(94,27,52,.08); border:1px solid var(--line); margin-bottom:16px; text-align:center;}
  .heroLabel{color:var(--grey); font-size:13px;}
  .heroNumber{font-family:var(--serif); font-size:48px; font-weight:600; color:var(--plum); line-height:1.05; margin:4px 0 10px;}
  .heroRule{height:2px; width:70px; margin:0 auto 14px; background:linear-gradient(90deg, transparent, var(--gold), transparent);}
  .heroStats{display:flex; justify-content:center; gap:40px;}
  .miniLabel{color:var(--grey); font-size:12px;}
  .miniValue{font-family:var(--serif); font-size:23px; color:var(--plum); font-weight:600;}

  .actionRow{display:flex; justify-content:flex-end; margin-bottom:14px;}
  .goldBtn{background:linear-gradient(135deg, var(--gold), #9c7530); color:#fff; border:none;
    padding:11px 18px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:600;
    box-shadow:0 4px 14px rgba(182,138,60,.3);}
  .roseBtn{background:var(--roseSoft); color:var(--plum); border:1px solid var(--line);
    padding:8px 14px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600;}

  .card{background:var(--surface); border-radius:20px; padding:18px; margin-bottom:18px;
    border:1px solid var(--line); box-shadow:0 8px 24px rgba(94,27,52,.06);}
  .monthHead{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .monthTitle{flex:1; min-width:0; font-family:var(--serif); font-size:25px; font-weight:600;
    color:var(--plum); border:none; background:transparent; padding:2px 0;}
  .monthTotals{text-align:right; white-space:nowrap;}
  .monthOmzet{font-family:var(--serif); font-size:23px; font-weight:600; color:var(--plum);}
  .monthWinst{font-size:12px; color:var(--gold); margin-top:2px;}
  .rowAdd{margin:6px 0 12px;}

  .thead,.row{display:grid; grid-template-columns:minmax(120px,1.6fr) .9fr .7fr 1fr .9fr 34px; gap:10px; align-items:center;}
  .sthead,.srow{display:grid; grid-template-columns:minmax(140px,1.8fr) .9fr 1fr 1fr 34px; gap:10px; align-items:start;}
  .thead,.sthead{color:var(--grey); font-size:12px; padding:0 4px 8px; border-bottom:1px solid var(--line); margin-bottom:8px;}
  .row,.srow{padding:8px 4px; border-bottom:1px solid var(--line);}
  .flabel{display:none;}
  .inp{width:100%; border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:15px; color:var(--ink); background:#fff;}
  .sel{width:100%; border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:15px; color:var(--ink); background:#fff; cursor:pointer;}
  .rt{text-align:right;}
  .greyPrice{display:block; text-align:right; color:var(--grey); font-size:14px; padding:8px 4px;}
  .winst{display:block; text-align:right; font-weight:600; font-size:14px; padding:8px 4px;}
  .soldTag{display:inline-block; margin-top:6px; font-size:11px; color:var(--rose); background:var(--roseSoft); border-radius:6px; padding:2px 8px;}
  .soldDate{display:inline-block; margin-top:6px; margin-left:6px; font-size:11px; color:var(--grey);}
  .remainNote{display:block; text-align:right; font-size:11px; color:var(--grey); margin-top:3px;}
  .iconBtn{border:1px solid var(--line); background:#fff; color:var(--rose); border-radius:9px; width:32px; height:32px; cursor:pointer; font-size:13px;}
  .iconBtnSm{border:none; background:transparent; color:var(--grey); cursor:pointer; font-size:15px; padding:6px;}
  .emptyInline{color:var(--grey); text-align:center; padding:18px 8px; font-size:14px;}

  .winRow{padding:12px 4px; border-bottom:1px solid var(--line);}
  .winTop{display:flex; justify-content:space-between; align-items:baseline;}
  .winMonth{font-family:var(--serif); font-size:20px; font-weight:600; color:var(--plum);}
  .winAmt{font-family:var(--serif); font-size:20px; font-weight:600;}
  .barTrack{height:8px; background:var(--roseSoft); border-radius:999px; margin:8px 0 4px; overflow:hidden;}
  .barFill{height:100%; border-radius:999px;}
  .winSub{font-size:12px; color:var(--grey);}

  .footer{text-align:center; color:var(--grey); font-size:12px; padding:22px 0 8px;}

  .modalWrap{position:fixed; inset:0; background:rgba(60,20,35,.45); display:grid; place-items:center; padding:20px; z-index:50;}
  .modal{background:#fff; border-radius:18px; padding:22px; max-width:360px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.25); border:1px solid var(--line);}
  .modalTitle{font-family:var(--serif); font-size:22px; color:var(--plum); font-weight:600; margin-bottom:6px;}
  .modalText{color:var(--ink); font-size:14px; margin-bottom:18px; line-height:1.5;}
  .modalBtns{display:flex; gap:10px; justify-content:flex-end;}
  .cancelBtn{background:#fff; border:1px solid var(--line); color:var(--ink); padding:9px 16px; border-radius:10px; cursor:pointer; font-size:14px;}
  .deleteBtn{background:var(--rose); border:none; color:#fff; padding:9px 16px; border-radius:10px; cursor:pointer; font-size:14px; font-weight:600;}

  @media (max-width:660px){
    .thead,.sthead{display:none;}
    .row,.srow{grid-template-columns:1fr 1fr; gap:8px 12px; padding:12px; border:1px solid var(--line); border-radius:14px; margin-bottom:10px; background:#fff;}
    .row .cell:first-child,.srow .cell:first-child{grid-column:1 / -1;}
    .flabel{display:block; font-size:11px; color:var(--grey); margin-bottom:3px;}
    .del{grid-column:1 / -1; justify-self:end;}
  }
</style>
</head>

<div id="modal"></div>

<script>
(function(){
  "use strict";

  var SUPA_URL = "https://lkzxkovpswyllzunrqks.supabase.co";
  var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxrenhrb3Zwc3d5bGx6dW5ycWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3Nzc2NjgsImV4cCI6MjEwMTM1MzY2OH0.u8Oav9kcO5d9G9q3fi8LmSyDTIqJ6B8kgJvKeH_hVt0";
  var PIN = "shauni";
  var REST = SUPA_URL + "/rest/v1/shauni_shop";

  var MONTHS = ["Januari","Februari","Maart","April","Mei","Juni","Juli","Augustus","September","Oktober","November","December"];

  var state = { stock:[], months:[] };
  var lastUpdatedAt = null;
  var tab = "verkoop";
  var pending = null;
  var dirty = false;
  var saveTimer = null;

  function uid(){ return Math.random().toString(36).slice(2,10); }
  function parseNum(v){ var n = parseFloat(String(v==null?"":v).replace(",",".")); return isNaN(n)?0:n; }
  function euro(n){ if(isNaN(n)) n=0; return new Intl.NumberFormat("nl-BE",{style:"currency",currency:"EUR",minimumFractionDigits:0,maximumFractionDigits:2}).format(n||0); }
  function escA(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function el(id){ return document.getElementById(id); }

  function parseLabel(label){
    var p = String(label).trim().split(/\s+/);
    if(p.length>=2){
      var mi=-1; for(var i=0;i<MONTHS.length;i++){ if(MONTHS[i].toLowerCase()===p[0].toLowerCase()){ mi=i; break; } }
      var y=parseInt(p[1],10);
      if(mi>=0 && !isNaN(y)) return {mi:mi,y:y};
    }
    return null;
  }

  /* ---- afgeleide berekeningen ---- */
  var MA=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
  function pad2(n){ n=String(n); return n.length<2?("0"+n):n; }
  function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function fmtDate(iso){ if(!iso) return ""; var p=String(iso).split("-"); if(p.length<3) return iso; var m=parseInt(p[1],10)-1; return parseInt(p[2],10)+" "+(MA[m]||"")+" "+p[0]; }
  function syncSoldOut(){
    var sm=stockMap(), sq=soldQtyMap();
    state.stock.forEach(function(s){
      if(isSoldOut(s.id,sm,sq)){ if(!s.soldOutAt) s.soldOutAt=todayISO(); }
      else if(s.soldOutAt){ delete s.soldOutAt; }
    });
  }

  function stockMap(){ var m={}; state.stock.forEach(function(s){ m[s.id]=s; }); return m; }
  function soldQtyMap(){ var m={}; state.months.forEach(function(mo){ mo.rows.forEach(function(r){ if(r.articleId){ m[r.articleId]=(m[r.articleId]||0)+parseNum(r.qty); } }); }); return m; }
  function remaining(sid, sm, sq){ var s=sm[sid]; if(!s) return 0; return parseNum(s.qty) - (sq[sid]||0); }
  function isSoldOut(sid, sm, sq){ var s=sm[sid]; if(!s) return false; var q=parseNum(s.qty); return q>0 && (sq[sid]||0)>=q; }
  function rowWinst(r, sm){ var a=sm[r.articleId]; var bp=a?parseNum(a.buy):0; return parseNum(r.sold) - parseNum(r.qty)*bp; }
  function monthOmzet(m){ var t=0; m.rows.forEach(function(r){ t+=parseNum(r.sold); }); return t; }
  function monthWinst(m, sm){ var t=0; m.rows.forEach(function(r){ t+=rowWinst(r,sm); }); return t; }
  function articleEarned(sid, sm){ var t=0; state.months.forEach(function(m){ m.rows.forEach(function(r){ if(r.articleId===sid) t+=rowWinst(r,sm); }); }); return t; }

  function totals(sm){
    var o=0,w=0,c=0;
    state.months.forEach(function(m){ o+=monthOmzet(m); w+=monthWinst(m,sm); m.rows.forEach(function(r){ if(r.articleId) c++; }); });
    return {omzet:o, winst:w, count:c};
  }

  /* ---- mutaties ---- */
  function addMonth(){
    var base=null;
    state.months.forEach(function(m){ var p=parseLabel(m.label); if(p){ var v=p.y*12+p.mi; if(base===null||v>base.v) base={mi:p.mi,y:p.y,v:v}; } });
    var mi,y;
    if(base){ mi=base.mi+1; y=base.y; if(mi>11){mi=0;y++;} }
    else { var now=new Date(); mi=now.getMonth(); y=now.getFullYear(); }
    var label=MONTHS[mi]+" "+y, guard=0;
    while(guard<60){ var dup=false; for(var i=0;i<state.months.length;i++){ if(state.months[i].label===label){dup=true;break;} } if(!dup) break; mi++; if(mi>11){mi=0;y++;} label=MONTHS[mi]+" "+y; guard++; }
    state.months.unshift({ id:uid(), label:label, rows:[] });
    render(); scheduleSave();
  }
  function addRow(mid){
    for(var i=0;i<state.months.length;i++){ if(state.months[i].id===mid){ state.months[i].rows.unshift({id:uid(),articleId:"",qty:"",sold:""}); break; } }
    render(); scheduleSave();
  }
  function addArticle(){ state.stock.unshift({id:uid(),name:"",qty:"",buy:""}); render(); scheduleSave(); }

  function doDelete(){
    if(!pending) return;
    var p=pending;
    if(p.kind==="month"){ state.months=state.months.filter(function(m){ return m.id!==p.mid; }); }
    else if(p.kind==="row"){ for(var i=0;i<state.months.length;i++){ if(state.months[i].id===p.mid){ state.months[i].rows=state.months[i].rows.filter(function(r){ return r.id!==p.rid; }); break; } } }
    else if(p.kind==="article"){ state.stock=state.stock.filter(function(s){ return s.id!==p.sid; }); }
    pending=null; renderModal(); render(); scheduleSave();
  }

  /* ---- render ---- */
  function render(){
    syncSoldOut();
    var v=el("view");
    if(tab==="verkoop") v.innerHTML=buildVerkoop();
    else if(tab==="stock") v.innerHTML=buildStock();
    else v.innerHTML=buildWinst();
    updateDerived();
  }

  function buildVerkoop(){
    var sm=stockMap(), sq=soldQtyMap(), t=totals(sm);
    var h="";
    h+='<section class="hero">';
    h+='<div class="heroLabel">Totale omzet</div>';
    h+='<div class="heroNumber" data-hero="big">'+euro(t.omzet)+'</div>';
    h+='<div class="heroRule"></div>';
    h+='<div class="heroStats"><div><div class="miniLabel">Winst</div><div class="miniValue" data-hero="a" style="color:var(--gold);">'+euro(t.winst)+'</div></div>';
    h+='<div><div class="miniLabel">Verkopen</div><div class="miniValue" data-hero="b">'+t.count+'</div></div></div></section>';

    h+='<div class="actionRow"><button class="goldBtn" data-addmonth="1">+ Nieuwe maand</button></div>';

    if(state.months.length===0){ h+='<div class="card"><div class="emptyInline">Nog geen maanden \u2014 voeg er een toe.</div></div>'; return h; }

    state.months.forEach(function(m){
      h+='<section class="card">';
      h+='<div class="monthHead">';
      h+='<input class="monthTitle" data-mrename="'+m.id+'" value="'+escA(m.label)+'">';
      h+='<div class="monthTotals"><div class="monthOmzet" data-omzet="'+m.id+'">'+euro(monthOmzet(m))+'</div><div class="monthWinst">winst <span data-winst="'+m.id+'">'+euro(monthWinst(m,sm))+'</span></div></div>';
      h+='<button class="iconBtn" data-del="month" data-mid="'+m.id+'" title="Maand verwijderen">\u2715</button>';
      h+='</div>';
      h+='<div class="rowAdd"><button class="roseBtn" data-addrow="'+m.id+'">+ Nieuwe rij</button></div>';

      if(m.rows.length===0){ h+='<div class="emptyInline">Nog geen verkopen deze maand \u2014 voeg je eerste rij toe.</div>'; }
      else{
        h+='<div class="thead"><span>Artikel</span><span class="rt">Aankoop/stuk</span><span class="rt">Aantal</span><span class="rt">Verkocht voor</span><span class="rt">Winst</span><span></span></div>';
        m.rows.forEach(function(r){
          var a=sm[r.articleId]; var bp=a?parseNum(a.buy):0;
          h+='<div class="row">';
          h+='<div class="cell"><span class="flabel">Artikel</span><select class="sel" data-field="article" data-mid="'+m.id+'" data-rid="'+r.id+'">';
          h+='<option value="">Kies artikel\u2026</option>';
          state.stock.forEach(function(s){
            if(isSoldOut(s.id,sm,sq) && s.id!==r.articleId) return;
            var sel=(s.id===r.articleId)?' selected':'';
            var nm=(s.name||"(naamloos)")+(isSoldOut(s.id,sm,sq)?" \u2014 uitverkocht":"");
            h+='<option value="'+s.id+'"'+sel+'>'+escA(nm)+'</option>';
          });
          h+='</select></div>';
          h+='<div class="cell rt"><span class="flabel">Aankoop/stuk</span><span class="greyPrice">'+(a?euro(bp):"\u2014")+'</span></div>';
          h+='<div class="cell rt"><span class="flabel">Aantal</span><input class="inp rt" inputmode="decimal" data-field="qty" data-mid="'+m.id+'" data-rid="'+r.id+'" value="'+escA(r.qty)+'" placeholder="0"></div>';
          h+='<div class="cell rt"><span class="flabel">Verkocht voor</span><input class="inp rt" inputmode="decimal" data-field="sold" data-mid="'+m.id+'" data-rid="'+r.id+'" value="'+escA(r.sold)+'" placeholder="\u20ac 0"></div>';
          var w=rowWinst(r,sm); var wc=(w>=0)?"var(--win)":"var(--rose)"; var wt=(r.sold||r.qty)?euro(w):"\u2014";
          h+='<div class="cell rt"><span class="flabel">Winst</span><span class="winst" data-rwinst="'+m.id+":"+r.id+'" style="color:'+wc+';">'+wt+'</span></div>';
          h+='<div class="cell del"><button class="iconBtnSm" data-del="row" data-mid="'+m.id+'" data-rid="'+r.id+'" title="Rij verwijderen">\u2715</button></div>';
          h+='</div>';
        });
      }
      h+='</section>';
    });
    return h;
  }

  function buildStock(){
    var sm=stockMap(), sq=soldQtyMap(), t=totals(sm);
    var vw=0; state.stock.forEach(function(a){ var rem=remaining(a.id,sm,sq); vw+=(rem>0?rem:0)*parseNum(a.buy); });
    var h="";
    h+='<section class="hero">';
    h+='<div class="heroLabel">Totaal verdiend</div>';
    h+='<div class="heroNumber" data-hero="big">'+euro(t.winst)+'</div>';
    h+='<div class="heroRule"></div>';
    h+='<div class="heroStats"><div><div class="miniLabel">Voorraadwaarde</div><div class="miniValue" data-hero="a" style="color:var(--gold);">'+euro(vw)+'</div></div>';
    h+='<div><div class="miniLabel">Artikelen</div><div class="miniValue" data-hero="b">'+state.stock.length+'</div></div></div></section>';

    h+='<div class="actionRow"><button class="goldBtn" data-addart="1">+ Nieuw artikel</button></div>';
    h+='<section class="card">';
    if(state.stock.length===0){ h+='<div class="emptyInline">Nog geen artikelen \u2014 voeg je eerste product toe.</div>'; }
    else{
      h+='<div class="sthead"><span>Product</span><span class="rt">Aantal stuks</span><span class="rt">Aankoop/eenheid</span><span class="rt">Totaal verdiend</span><span></span></div>';
      var avail=[], soldA=[];
      state.stock.forEach(function(s){ if(isSoldOut(s.id,sm,sq)) soldA.push(s); else avail.push(s); });
      soldA.sort(function(a,b){ var da=a.soldOutAt||"", db=b.soldOutAt||""; if(da<db) return 1; if(da>db) return -1; return 0; });
      avail.concat(soldA).forEach(function(s){
        var rem=remaining(s.id,sm,sq); var sold=isSoldOut(s.id,sm,sq);
        h+='<div class="srow">';
        h+='<div class="cell"><span class="flabel">Product</span><input class="inp" data-field="sname" data-sid="'+s.id+'" value="'+escA(s.name)+'" placeholder="Productnaam">'+(sold?'<span class="soldTag">uitverkocht</span>'+(s.soldOutAt?'<span class="soldDate">'+fmtDate(s.soldOutAt)+'</span>':''):'')+'</div>';
        h+='<div class="cell rt"><span class="flabel">Aantal stuks</span><input class="inp rt" inputmode="decimal" data-field="sqty" data-sid="'+s.id+'" value="'+escA(s.qty)+'" placeholder="0">'+(parseNum(s.qty)>0?'<span class="remainNote" data-srem="'+s.id+'">nog '+rem+' te verkopen</span>':'<span class="remainNote" data-srem="'+s.id+'"></span>')+'</div>';
        h+='<div class="cell rt"><span class="flabel">Aankoop/eenheid</span><input class="inp rt" inputmode="decimal" data-field="sbuy" data-sid="'+s.id+'" value="'+escA(s.buy)+'" placeholder="\u20ac 0"></div>';
        var e=articleEarned(s.id,sm); var ec=(e>=0)?"var(--win)":"var(--rose)";
        h+='<div class="cell rt"><span class="flabel">Totaal verdiend</span><span class="winst" data-searn="'+s.id+'" style="color:'+ec+';">'+euro(e)+'</span></div>';
        h+='<div class="cell del"><button class="iconBtnSm" data-del="article" data-sid="'+s.id+'" title="Artikel verwijderen">\u2715</button></div>';
        h+='</div>';
      });
    }
    h+='</section>';
    return h;
  }

  function buildWinst(){
    var sm=stockMap(), t=totals(sm);
    var maxw=1; state.months.forEach(function(m){ var w=Math.abs(monthWinst(m,sm)); if(w>maxw) maxw=w; });
    var h="";
    h+='<section class="hero">';
    h+='<div class="heroLabel">Totale winst</div>';
    h+='<div class="heroNumber" data-hero="big" style="color:'+(t.winst>=0?"var(--plum)":"var(--rose)")+';">'+euro(t.winst)+'</div>';
    h+='<div class="heroRule"></div>';
    h+='<div class="heroStats"><div><div class="miniLabel">Omzet</div><div class="miniValue" data-hero="a" style="color:var(--gold);">'+euro(t.omzet)+'</div></div>';
    h+='<div><div class="miniLabel">Maanden</div><div class="miniValue" data-hero="b">'+state.months.length+'</div></div></div></section>';

    h+='<section class="card">';
    if(state.months.length===0){ h+='<div class="emptyInline">Nog geen maanden om winst te tonen.</div>'; }
    else{
      state.months.forEach(function(m){
        var w=monthWinst(m,sm); var pct=Math.min(100,(Math.abs(w)/maxw)*100);
        var wc=(w>=0)?"var(--win)":"var(--rose)";
        var fill=(w>=0)?"linear-gradient(90deg, var(--goldSoft), var(--gold))":"var(--rose)";
        h+='<div class="winRow"><div class="winTop"><span class="winMonth">'+escA(m.label)+'</span><span class="winAmt" data-wamt="'+m.id+'" style="color:'+wc+';">'+euro(w)+'</span></div>';
        h+='<div class="barTrack"><div class="barFill" data-wbar="'+m.id+'" style="width:'+pct+'%; background:'+fill+';"></div></div>';
        h+='<div class="winSub">omzet <span data-womz="'+m.id+'">'+euro(monthOmzet(m))+'</span></div></div>';
      });
    }
    h+='</section>';
    return h;
  }

  /* ---- alleen cijfers bijwerken (zonder velden opnieuw op te bouwen) ---- */
  function updateDerived(){
    var sm=stockMap(), sq=soldQtyMap(), t=totals(sm);
    var big=document.querySelector('[data-hero="big"]');
    var a=document.querySelector('[data-hero="a"]');
    var b=document.querySelector('[data-hero="b"]');
    if(big&&a&&b){
      if(tab==="verkoop"){ big.textContent=euro(t.omzet); a.textContent=euro(t.winst); b.textContent=t.count; }
      else if(tab==="stock"){ var vw=0; state.stock.forEach(function(x){ var rem=remaining(x.id,sm,sq); vw+=(rem>0?rem:0)*parseNum(x.buy); }); big.textContent=euro(t.winst); a.textContent=euro(vw); b.textContent=state.stock.length; }
      else { big.textContent=euro(t.winst); big.style.color=(t.winst>=0?"var(--plum)":"var(--rose)"); a.textContent=euro(t.omzet); b.textContent=state.months.length; }
    }
    state.months.forEach(function(m){
      var eo=document.querySelector('[data-omzet="'+m.id+'"]'); if(eo) eo.textContent=euro(monthOmzet(m));
      var ew=document.querySelector('[data-winst="'+m.id+'"]'); if(ew) ew.textContent=euro(monthWinst(m,sm));
      m.rows.forEach(function(r){
        var er=document.querySelector('[data-rwinst="'+m.id+":"+r.id+'"]');
        if(er){ var w=rowWinst(r,sm); er.textContent=(r.sold||r.qty)?euro(w):"\u2014"; er.style.color=(w>=0)?"var(--win)":"var(--rose)"; }
      });
      var wa=document.querySelector('[data-wamt="'+m.id+'"]');
      if(wa){ var mw=monthWinst(m,sm); wa.textContent=euro(mw); wa.style.color=(mw>=0)?"var(--win)":"var(--rose)"; }
      var wo=document.querySelector('[data-womz="'+m.id+'"]'); if(wo) wo.textContent=euro(monthOmzet(m));
    });
    var maxw=1; state.months.forEach(function(m){ var w=Math.abs(monthWinst(m,sm)); if(w>maxw) maxw=w; });
    state.months.forEach(function(m){ var wb=document.querySelector('[data-wbar="'+m.id+'"]'); if(wb){ var pct=Math.min(100,(Math.abs(monthWinst(m,sm))/maxw)*100); wb.style.width=pct+"%"; } });
    state.stock.forEach(function(s){
      var se=document.querySelector('[data-searn="'+s.id+'"]'); if(se){ var e=articleEarned(s.id,sm); se.textContent=euro(e); se.style.color=(e>=0)?"var(--win)":"var(--rose)"; }
      var sr=document.querySelector('[data-srem="'+s.id+'"]'); if(sr){ sr.textContent=(parseNum(s.qty)>0)?("nog "+remaining(s.id,sm,sq)+" te verkopen"):""; }
    });
  }

  function findRow(mid,rid){ for(var i=0;i<state.months.length;i++){ if(state.months[i].id===mid){ var rs=state.months[i].rows; for(var j=0;j<rs.length;j++){ if(rs[j].id===rid) return rs[j]; } } } return null; }
  function findArticle(sid){ for(var i=0;i<state.stock.length;i++){ if(state.stock[i].id===sid) return state.stock[i]; } return null; }
  function findMonth(mid){ for(var i=0;i<state.months.length;i++){ if(state.months[i].id===mid) return state.months[i]; } return null; }

  /* ---- events ---- */
  var view=el("view");
  view.addEventListener("input", function(e){
    var el2=e.target, f=el2.getAttribute("data-field");
    if(el2.hasAttribute("data-mrename")){ var m=findMonth(el2.getAttribute("data-mrename")); if(m){ m.label=el2.value; scheduleSave(); } return; }
    if(!f) return;
    if(f==="qty"||f==="sold"){ var r=findRow(el2.getAttribute("data-mid"), el2.getAttribute("data-rid")); if(r){ r[f==="qty"?"qty":"sold"]=el2.value; } }
    else if(f==="sname"||f==="sqty"||f==="sbuy"){ var s=findArticle(el2.getAttribute("data-sid")); if(s){ s[f==="sname"?"name":(f==="sqty"?"qty":"buy")]=el2.value; } }
    syncSoldOut(); updateDerived(); scheduleSave();
  });
  view.addEventListener("change", function(e){
    var el2=e.target;
    if(el2.getAttribute("data-field")==="article"){
      var r=findRow(el2.getAttribute("data-mid"), el2.getAttribute("data-rid"));
      if(r){ r.articleId=el2.value; render(); scheduleSave(); }
    }
  });
  view.addEventListener("click", function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.hasAttribute("data-addmonth")){ addMonth(); return; }
    if(b.hasAttribute("data-addart")){ addArticle(); return; }
    if(b.hasAttribute("data-addrow")){ addRow(b.getAttribute("data-addrow")); return; }
    var dk=b.getAttribute("data-del");
    if(dk==="month"){ var m=findMonth(b.getAttribute("data-mid")); pending={kind:"month",mid:b.getAttribute("data-mid"),text:'Maand "'+(m?m.label:"")+'" met alle rijen verwijderen?'}; renderModal(); }
    else if(dk==="row"){ pending={kind:"row",mid:b.getAttribute("data-mid"),rid:b.getAttribute("data-rid"),text:"Deze rij verwijderen?"}; renderModal(); }
    else if(dk==="article"){ var s=findArticle(b.getAttribute("data-sid")); pending={kind:"article",sid:b.getAttribute("data-sid"),text:'Artikel "'+(s&&s.name?s.name:"(naamloos)")+'" verwijderen?'}; renderModal(); }
  });

  el("tabs").addEventListener("click", function(e){
    var b=e.target.closest("button"); if(!b) return;
    tab=b.getAttribute("data-tab");
    var btns=el("tabs").querySelectorAll(".tab"); for(var i=0;i<btns.length;i++){ btns[i].classList.toggle("on", btns[i]===b); }
    render();
  });

  function renderModal(){
    var m=el("modal");
    if(!pending){ m.innerHTML=""; return; }
    m.innerHTML='<div class="modalWrap" id="mwrap"><div class="modal"><div class="modalTitle">Verwijderen</div><div class="modalText">'+escA(pending.text)+'</div><div class="modalBtns"><button class="cancelBtn" id="mcancel">Annuleren</button><button class="deleteBtn" id="mok">Verwijderen</button></div></div></div>';
    el("mcancel").onclick=function(){ pending=null; renderModal(); };
    el("mok").onclick=function(){ doDelete(); };
    el("mwrap").onclick=function(ev){ if(ev.target===el("mwrap")){ pending=null; renderModal(); } };
  }

  el("refresh").addEventListener("click", function(){ pull(false); });

  /* ---- sync met Supabase ---- */
  function headers(extra){
    var h={ "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY, "Content-Type":"application/json" };
    if(extra){ for(var k in extra) h[k]=extra[k]; }
    return h;
  }
  function setStatus(txt){ var s=el("status"); if(s) s.textContent=txt; }

  function normalize(d){
    var out={ stock:[], months:[] };
    if(d && Array.isArray(d.stock)) out.stock=d.stock;
    if(d && Array.isArray(d.months)) out.months=d.months;
    return out;
  }

  function pull(applyIfNewer){
    return fetch(REST+"?id=eq.main&select=data,updated_at", { headers:headers() })
      .then(function(res){ return res.json(); })
      .then(function(arr){
        if(!arr || !arr.length){ return; }
        var row=arr[0];
        if(applyIfNewer){
          if(row.updated_at===lastUpdatedAt) return;
          if(dirty) return;
          var ae=document.activeElement; if(ae && (ae.tagName==="INPUT"||ae.tagName==="SELECT")) return;
        }
        state=normalize(row.data);
        lastUpdatedAt=row.updated_at;
        try{ localStorage.setItem("ss_cache", JSON.stringify(state)); }catch(e){}
        render();
        setStatus("bijgewerkt");
      })
      .catch(function(){ setStatus("offline"); });
  }

  function scheduleSave(){
    dirty=true; setStatus("bewaren\u2026");
    try{ localStorage.setItem("ss_cache", JSON.stringify(state)); }catch(e){}
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer=setTimeout(doSave, 700);
  }
  function doSave(){
    var body=[{ id:"main", data:state, updated_at:new Date().toISOString() }];
    fetch(REST, { method:"POST", headers:headers({ "Prefer":"resolution=merge-duplicates,return=representation" }), body:JSON.stringify(body) })
      .then(function(res){ return res.json(); })
      .then(function(arr){ if(arr && arr.length){ lastUpdatedAt=arr[0].updated_at; } dirty=false; setStatus("bewaard"); })
      .catch(function(){ setStatus("offline \u2014 later opnieuw"); if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(doSave, 4000); });
  }

  /* poll voor wijzigingen van het andere toestel */
  setInterval(function(){ if(document.visibilityState==="visible"){ pull(true); } }, 9000);
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible") pull(true); });

  /* ---- opstart ---- */
  function start(){
    el("lock").style.display="none";
    el("shell").style.display="block";
    try{ var c=localStorage.getItem("ss_cache"); if(c){ state=normalize(JSON.parse(c)); } }catch(e){}
    render();
    pull(false);
    
  }

  function tryUnlock(){
    var v=el("pinInput").value;
    if(v===PIN){ try{ localStorage.setItem("ss_unlocked","1"); }catch(e){} start(); }
    else { el("pinErr").textContent="Verkeerde code, probeer opnieuw."; el("pinInput").value=""; }
  }
  el("pinBtn").addEventListener("click", tryUnlock);
  el("pinInput").addEventListener("keydown", function(e){ if(e.key==="Enter") tryUnlock(); });

  var unlocked=false; try{ unlocked=localStorage.getItem("ss_unlocked")==="1"; }catch(e){}
  if(unlocked){ start(); } else { el("pinInput").focus(); }
})();
</script>
</body>
</html>
